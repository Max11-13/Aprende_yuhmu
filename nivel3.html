<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="EQUIPOS">
    <meta name="description" content="LENGUA INDIGENAS">
    <title>APRENDE-YUHMU</title>
    <link rel="stylesheet" href="nivel3.css">
</head>
<body>
  
  <header class="encabezado">
        <h2 class="titulo">¡Aprendamos!</h2>
        <h2 class="span" id="tituloNivel">Nivel 3</h2>

          <div class="globo" id="mensaje">
    ¡ESCUCHA Y APRENDE!
    </div>

   
  </header>

  <main class="contenedor-principal">
    <section class="informacion">
            <img src="imagen/cc.jpg" alt="Imagen de un perro" class="dur">
   <div class="marco-ventana"></div>
        
        <!-- NIVEL 1 -->
       <div class="nivel" id="nivel1">
          <div class="cuadro1">
                <img src="imagen/man.jpg" alt="Imagen de uvas" class="palabra2">
                <h3>Manzana</h3>
                <h2>Manzansi</h2>

                <audio id="audio1">
                    <source src="audio/man.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton1" type="button">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro2">
                 <img src="imagen/caña.jpg" alt="Imagen de sandía" class="palabra2">
                <h3>Caña</h3>
                <h2>Cayo</h2>

                <audio id="audio2">
                    <source src="audio/caña.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton2">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro3">
                  <img src="imagen/tuna.jpg" alt="Imagen de piña" class="palabra2">
                <h3>Tuna</h3>
                <h2>Caja</h2>

                <audio id="audio3">
                    <source src="audio/tuna.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton3">PRONUNCIACIÓN</button>
            </div>
        </div>

        <!-- NIVEL 2 -->
        <div class="nivel" id="nivel2" style="display: none;">
            <div class="cuadro4">
                <img src="imagen/zapo.jpg" alt="Manzana" class="palabra2">
                <h3>Zapote</h3>
                <h2>Müza</h2>
                
                <audio id="audio4">
                    <source src="audio/zapo.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton4">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro5">
                <img src="imagen/nara.jpg" alt="Mango" class="palabra2">
                <h3>Naranja</h3>
                <h2>Ixi</h2>
                
                <audio id="audio5">
                    <source src="audio/nara.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton5">PRONUNCIACIÓN</button>
            </div>

            
        </div>
    </section>

  
    <div class="botones">
        <button class="navegacion" id="Anterior" style="display: none;">Atrás</button>
        <button class="navegacion" id="Siguiente">Siguiente</button>
        <button class="navegacion" id="jugar" style="display: none;">¡Jugar!</button>
        <button class="navegacion" id="atras">Mapa</button>
    </div>
  </main>

  <script src="nivel3.js"></script>
</body>
</html>
