<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="EQUIPOS">
    <meta name="description" content="LENGUA INDIGENAS">
    <title>APRENDE-YUHMU</title>
    <link rel="stylesheet" href="nivel4.css">
</head>
<body>
  
  <header class="encabezado">
        <h2 class="titulo">¡Aprendamos!</h2>
        <h2 class="span" id="tituloNivel">Nivel 4</h2>

          <div class="globo" id="mensaje">
    ¡ESCUCHA Y APRENDE!
    </div>

   
  </header>

  <main class="contenedor-principal">
    <section class="informacion">
            <img src="imagen/cc.jpg" alt="Imagen de un perro" class="dur">
   <div class="marco-ventana"></div>
        
        <!-- NIVEL 1 -->
       <div class="nivel" id="nivel1">
          <div class="cuadro1">
                <img src="imagen/pantalon.jpg" alt="Imagen de uvas" class="palabra2">
                <h3>Pantalón</h3>
                <h2>Kokua</h2>

                <audio id="audio1">
                    <source src="audio/pan.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton1" type="button">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro2">
                 <img src="imagen/camisa.jpg" alt="Imagen de sandía" class="palabra2">
                <h3>Camisa</h3>
                <h2>Ngamixa</h2>

                <audio id="audio2">
                    <source src="audio/cam.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton2">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro3">
                  <img src="imagen/falda.jpg" alt="Imagen de piña" class="palabra2">
                <h3>Falda</h3>
                <h2>Dangade </h2>

                <audio id="audio3">
                    <source src="audio/falda.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton3">PRONUNCIACIÓN</button>
            </div>
        </div>

        <!-- NIVEL 2 -->
        <div class="nivel" id="nivel2" style="display: none;">
            <div class="cuadro4">
                <img src="imagen/ceñidor.jpg" alt="Manzana" class="palabra2">
                <h3>Ceñidor</h3>
                <h2>Kuti</h2>
                
                <audio id="audio4">
                    <source src="audio/cen.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton4">PRONUNCIACIÓN</button>
            </div>

            <div class="cuadro5">
                <img src="imagen/sombrero.jpg" alt="Mango" class="palabra2">
                <h3>Sombrero</h3>
                <h2>Pui</h2>
                
                <audio id="audio5">
                    <source src="audio/som.mp3" type="audio/mpeg">
                    no es compatible con tu navegador
                </audio>

                <button class="button-pronunciacion" id="boton5">PRONUNCIACIÓN</button>
            </div>

            
        </div>
    </section>

    <!-- BOTONES DE NAVEGACIÓN GENERALES -->
    <div class="contenedor-botones">
        <button class="btn-navegacion" id="btnAnterior" style="display: none;">Atrás</button>
        <button class="btn-navegacion" id="btnSiguiente">Siguiente</button>
        <button class="btn-navegacion" id="jugar" style="display: none;">¡Jugar!</button>
        <button class="btn-navegacion" id="atras">Mapa</button>
    </div>
  </main>

  <script src="nivel4.js"></script>
</body>
</html>
