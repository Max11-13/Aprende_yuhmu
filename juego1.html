
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Juego de memorama para aprender vocabulario de animales.">
  <title>Memorama | Aprende Yuhmu</title>
  <link rel="stylesheet" href="juego1.css">
</head>
<body>
  <main class="memorama">
    <header class="memorama-cabecera">
    
      <h1>Memorama </h1>
     
       <img src="imagen/cc.jpg" alt="Imagen de un perro" class="dur">

      
   
         </div>

    </header>
      <div class="globo" id="mensaje"> ¡A JUGAR!</div>

    <section class="memorama-panel" aria-label="Marcador del juego">
      <p>Movimientos: <strong id="movimientos">0</strong></p>
      <p>Parejas: <strong id="parejas">0</strong> de 4</p>
      <button id="reiniciar" type="button">Reiniciar juego</button>
    </section>

    <section id="tablero" class="tablero-memorama" aria-label="Cartas del memorama"></section>
    <p id="estado-juego" class="estado-juego" aria-live="polite"></p>

    <button class="volver-memorama" id="juego">← Volver</button>
  </main>

  <script src="juego1.js" defer></script>

</html>
